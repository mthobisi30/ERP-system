{% extends "layout.html" %}

{% block content %}
<div class="max-w-6xl mx-auto space-y-6">

  <!-- Builder -->
  <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
    <h2 class="text-lg font-semibold text-gray-900 mb-4"><i class="fas fa-file-contract text-primary-500 mr-2"></i>New Quote</h2>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1">Title</label>
        <input id="q-title" placeholder="Website rebuild proposal" class="w-full px-3 py-2 border border-gray-200 rounded-lg bg-gray-50 text-sm">
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1">Customer</label>
        <select id="q-customer" class="w-full px-3 py-2 border border-gray-200 rounded-lg bg-gray-50 text-sm"></select>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1">Valid until</label>
        <input type="date" id="q-valid" class="w-full px-3 py-2 border border-gray-200 rounded-lg bg-gray-50 text-sm">
      </div>
    </div>

    <div id="lines" class="space-y-2"></div>
    <button id="add-line" class="mt-2 text-sm text-primary-600 hover:text-primary-700"><i class="fas fa-plus mr-1"></i>Add line</button>

    <div class="flex justify-end mt-4">
      <div class="w-64 space-y-1 text-sm">
        <div class="flex justify-between text-gray-600"><span>Subtotal</span><span id="t-sub">R 0.00</span></div>
        <div class="flex justify-between text-gray-600"><span>VAT (15%)</span><span id="t-vat">R 0.00</span></div>
        <div class="flex justify-between font-bold text-gray-900 pt-1 border-t border-gray-200"><span>Total</span><span id="t-total">R 0.00</span></div>
      </div>
    </div>
    <div class="flex justify-end mt-3">
      <button id="save-quote" class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 text-sm font-semibold">Save Quote</button>
    </div>
    <p id="q-msg" class="text-sm mt-3 hidden"></p>
  </div>

  <!-- List -->
  <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
    <div class="px-6 py-4 border-b border-gray-100"><h3 class="font-semibold text-gray-900">Quotes</h3></div>
    <div id="quotes-body"><div class="p-8 text-center text-gray-400 text-sm">Loading…</div></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const RMONEY = n => 'R ' + Number(n || 0).toLocaleString('en-ZA', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  const VAT = 15;
  const ST = { draft: 'gray', sent: 'blue', accepted: 'green', declined: 'red', expired: 'yellow' };
  let lines = [{ description: '', quantity: 1, unit_price: 0 }];
  let customers = {};

  async function loadCustomers() {
    const data = await fetchData('/customers');
    const list = (data && data.customers) || [];
    customers = Object.fromEntries(list.map(c => [c.id, c.company_name || c.contact_person || '—']));
    document.getElementById('q-customer').innerHTML = '<option value="">— Select —</option>' +
      list.map(c => `<option value="${c.id}">${c.company_name || c.contact_person || c.email}</option>`).join('');
  }

  function renderLines() {
    document.getElementById('lines').innerHTML = lines.map((l, i) => `
      <div class="grid grid-cols-12 gap-2 items-center">
        <input data-i="${i}" data-f="description" value="${l.description}" placeholder="Description" class="col-span-6 px-3 py-2 border border-gray-200 rounded-lg bg-gray-50 text-sm line-input">
        <input data-i="${i}" data-f="quantity" type="number" step="0.25" value="${l.quantity}" placeholder="Qty" class="col-span-2 px-3 py-2 border border-gray-200 rounded-lg bg-gray-50 text-sm line-input">
        <input data-i="${i}" data-f="unit_price" type="number" step="0.01" value="${l.unit_price}" placeholder="Price" class="col-span-2 px-3 py-2 border border-gray-200 rounded-lg bg-gray-50 text-sm line-input">
        <span class="col-span-1 text-sm text-right text-gray-600">${RMONEY(l.quantity * l.unit_price)}</span>
        <button data-rm="${i}" class="col-span-1 text-red-400 hover:text-red-600 text-sm">&times;</button>
      </div>`).join('');
    document.querySelectorAll('.line-input').forEach(el => el.addEventListener('input', (e) => {
      const i = +e.target.dataset.i, f = e.target.dataset.f;
      lines[i][f] = f === 'description' ? e.target.value : parseFloat(e.target.value || 0);
      recalc();
    }));
    document.querySelectorAll('[data-rm]').forEach(el => el.addEventListener('click', (e) => {
      lines.splice(+e.target.dataset.rm, 1); if (!lines.length) lines = [{ description: '', quantity: 1, unit_price: 0 }];
      renderLines(); recalc();
    }));
    recalc();
  }

  function recalc() {
    const sub = lines.reduce((s, l) => s + (l.quantity * l.unit_price), 0);
    const vat = sub * VAT / 100;
    document.getElementById('t-sub').textContent = RMONEY(sub);
    document.getElementById('t-vat').textContent = RMONEY(vat);
    document.getElementById('t-total').textContent = RMONEY(sub + vat);
  }

  document.getElementById('add-line').addEventListener('click', () => { lines.push({ description: '', quantity: 1, unit_price: 0 }); renderLines(); });

  document.getElementById('save-quote').addEventListener('click', async () => {
    const body = {
      title: document.getElementById('q-title').value,
      customer_id: document.getElementById('q-customer').value || null,
      valid_until: document.getElementById('q-valid').value || null,
      items: lines.filter(l => l.description || l.unit_price),
    };
    const msg = document.getElementById('q-msg');
    const r = await fetch('/api/sales/quotations', { method: 'POST', headers: getHeaders(), body: JSON.stringify(body) });
    const data = await r.json();
    msg.classList.remove('hidden');
    if (r.ok) {
      msg.className = 'text-sm mt-3 text-green-600';
      msg.textContent = `Quote ${data.quote_number} saved (${RMONEY(data.total_amount)}).`;
      document.getElementById('q-title').value = '';
      lines = [{ description: '', quantity: 1, unit_price: 0 }]; renderLines();
      loadQuotes();
    } else {
      msg.className = 'text-sm mt-3 text-red-600';
      msg.textContent = data.error || 'Could not save quote.';
    }
  });

  window.quoteAction = async function (id, action) {
    let url, opts = { method: 'POST', headers: getHeaders() };
    if (action === 'accept') { url = `/api/sales/quotations/${id}/accept`; opts.body = JSON.stringify({}); }
    else { url = `/api/sales/quotations/${id}/status`; opts.body = JSON.stringify({ status: action }); }
    const r = await fetch(url, opts);
    const data = await r.json();
    if (r.ok) {
      if (action === 'accept') alert(`Accepted — project "${data.project.name}" created.`);
      loadQuotes();
    } else alert(data.error || 'Action failed');
  };

  async function loadQuotes() {
    const data = await fetchData('/sales/quotations');
    const body = document.getElementById('quotes-body');
    const list = (data && data.quotations) || [];
    if (!list.length) { body.innerHTML = '<div class="p-8 text-center text-gray-400 text-sm">No quotes yet.</div>'; return; }
    body.innerHTML = `
      <table class="min-w-full">
        <thead class="bg-gray-50 text-xs font-semibold text-gray-500 uppercase">
          <tr><th class="px-5 py-3 text-left">Quote #</th><th class="px-5 py-3 text-left">Title</th>
          <th class="px-5 py-3 text-left">Customer</th><th class="px-5 py-3 text-right">Total</th>
          <th class="px-5 py-3 text-center">Status</th><th class="px-5 py-3 text-right">Actions</th></tr>
        </thead>
        <tbody>${list.map(q => `
          <tr class="border-b border-gray-100 last:border-0 hover:bg-gray-50">
            <td class="px-5 py-3 text-sm font-medium text-gray-900">${q.quote_number}</td>
            <td class="px-5 py-3 text-sm text-gray-700">${q.title || '—'}</td>
            <td class="px-5 py-3 text-sm text-gray-600">${customers[q.customer_id] || '—'}</td>
            <td class="px-5 py-3 text-sm text-right">${RMONEY(q.total_amount)}</td>
            <td class="px-5 py-3 text-center"><span class="px-2 py-0.5 rounded-full text-xs bg-${ST[q.status] || 'gray'}-100 text-${ST[q.status] || 'gray'}-800 capitalize">${q.status}</span></td>
            <td class="px-5 py-3 text-right text-sm space-x-2">
              <button onclick="openPdf('/api/sales/quotations/${q.id}/pdf')" class="text-gray-500 hover:text-primary-600" title="PDF"><i class="fas fa-file-pdf"></i></button>
              ${q.status === 'draft' ? `<button onclick="quoteAction('${q.id}','sent')" class="text-blue-600 hover:underline">Send</button>` : ''}
              ${(q.status === 'draft' || q.status === 'sent') ? `<button onclick="quoteAction('${q.id}','accept')" class="text-green-600 hover:underline">Accept</button>` : ''}
              ${(q.status === 'draft' || q.status === 'sent') ? `<button onclick="quoteAction('${q.id}','declined')" class="text-red-500 hover:underline">Decline</button>` : ''}
              ${q.converted_project_id ? `<a href="/projects/${q.converted_project_id}" class="text-primary-600 hover:underline">Project</a>` : ''}
            </td>
          </tr>`).join('')}</tbody>
      </table>`;
  }

  loadCustomers().then(loadQuotes);
  renderLines();
</script>
{% endblock %}
