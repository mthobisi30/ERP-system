{% extends "layout.html" %}

{% block content %}
<div class="max-w-6xl mx-auto space-y-6">
  <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 flex items-center justify-between flex-wrap gap-3">
    <div>
      <h2 class="text-lg font-semibold text-gray-900"><i class="fas fa-inbox text-primary-500 mr-2"></i>Website Enquiries</h2>
      <p class="text-sm text-gray-500 mt-1"><span id="new-count" class="font-bold text-primary-600">0</span> new · submitted via your website contact form</p>
    </div>
    <select id="filter" class="px-3 py-2 border border-gray-200 rounded-lg bg-white text-sm">
      <option value="">All statuses</option><option value="new">New</option><option value="read">Read</option>
      <option value="responded">Responded</option><option value="archived">Archived</option>
    </select>
  </div>

  <div id="list" class="space-y-3"><div class="bg-white rounded-2xl border border-gray-200 p-8 text-center text-gray-400 text-sm">Loading…</div></div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const ST = { new: 'blue', read: 'gray', responded: 'green', archived: 'yellow' };
  const badge = s => `<span class="px-2 py-0.5 rounded-full text-xs bg-${ST[s] || 'gray'}-100 text-${ST[s] || 'gray'}-800 capitalize">${s}</span>`;

  async function load() {
    const status = document.getElementById('filter').value;
    const data = await fetchData(`/enquiries${status ? '?status=' + status : ''}`);
    document.getElementById('new-count').textContent = (data && data.new_count) || 0;
    const el = document.getElementById('list');
    const list = (data && data.enquiries) || [];
    if (!list.length) { el.innerHTML = '<div class="bg-white rounded-2xl border border-gray-200 p-8 text-center text-gray-400 text-sm">No enquiries.</div>'; return; }
    el.innerHTML = list.map(e => `
      <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-5">
        <div class="flex items-start justify-between gap-4">
          <div>
            <div class="flex items-center gap-2">
              <p class="font-semibold text-gray-900">${e.name}</p> ${badge(e.status)}
            </div>
            <p class="text-sm text-gray-500">${[e.email, e.phone, e.company].filter(Boolean).join(' · ') || '—'}</p>
            ${e.subject ? `<p class="text-sm font-medium text-gray-700 mt-2">${e.subject}</p>` : ''}
            <p class="text-sm text-gray-600 mt-1 whitespace-pre-wrap">${e.message}</p>
            <p class="text-xs text-gray-400 mt-2">${e.created_at ? new Date(e.created_at).toLocaleString() : ''}</p>
          </div>
          <div class="flex flex-col gap-1 text-sm flex-shrink-0">
            ${e.email ? `<a href="mailto:${e.email}" class="px-3 py-1.5 bg-primary-600 text-white rounded-lg text-center hover:bg-primary-700">Reply</a>` : ''}
            <button onclick="setStatus('${e.id}','read')" class="px-3 py-1.5 border border-gray-200 rounded-lg hover:bg-gray-50">Read</button>
            <button onclick="setStatus('${e.id}','responded')" class="px-3 py-1.5 border border-gray-200 rounded-lg hover:bg-gray-50">Responded</button>
            <button onclick="setStatus('${e.id}','archived')" class="px-3 py-1.5 border border-gray-200 rounded-lg hover:bg-gray-50">Archive</button>
            <button onclick="del('${e.id}')" class="px-3 py-1.5 text-red-500 hover:bg-red-50 rounded-lg">Delete</button>
          </div>
        </div>
      </div>`).join('');
  }

  window.setStatus = async function (id, status) {
    try { await apiFetch(`/enquiries/${id}`, { method: 'PUT', body: JSON.stringify({ status }) }); showToast('Marked ' + status, 'success'); load(); } catch (e) {}
  };
  window.del = async function (id) {
    if (!(await window.confirmDialog('Delete this enquiry?'))) return;
    try { await apiFetch(`/enquiries/${id}`, { method: 'DELETE' }); showToast('Enquiry deleted', 'success'); load(); } catch (e) {}
  };
  document.getElementById('filter').addEventListener('change', load);
  load();
</script>
{% endblock %}
