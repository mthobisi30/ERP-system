{% extends "layout.html" %}

{% block content %}
<div class="space-y-5">
  <div class="flex items-center justify-between gap-4 flex-wrap">
    <div class="flex items-center gap-2">
      <label class="text-sm text-gray-500">Project</label>
      <select id="board-project" class="px-3 py-2 border border-gray-200 rounded-lg bg-white text-sm focus:ring-2 focus:ring-primary-500">
        <option value="">All projects</option>
      </select>
    </div>
    <form id="quick-add" class="flex items-center gap-2">
      <input id="qa-title" placeholder="Quick add to To Do…" class="px-3 py-2 border border-gray-200 rounded-lg bg-white text-sm w-64">
      <button class="px-3 py-2 bg-primary-600 text-white rounded-lg text-sm hover:bg-primary-700">Add</button>
    </form>
  </div>

  <div id="board" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const COLUMNS = [
    { key: 'todo', label: 'To Do', color: 'gray' },
    { key: 'in_progress', label: 'In Progress', color: 'blue' },
    { key: 'done', label: 'Done', color: 'green' },
  ];
  const PRIO = { low: 'gray', medium: 'blue', high: 'orange', urgent: 'red' };
  let projectNames = {};

  async function loadProjects() {
    const data = await fetchData('/projects');
    const list = (data && data.projects) || [];
    projectNames = Object.fromEntries(list.map(p => [p.id, p.name]));
    document.getElementById('board-project').insertAdjacentHTML('beforeend',
      list.map(p => `<option value="${p.id}">${p.name}</option>`).join(''));
  }

  function card(t) {
    const prio = t.priority ? `<span class="px-1.5 py-0.5 rounded text-[10px] bg-${PRIO[t.priority] || 'gray'}-100 text-${PRIO[t.priority] || 'gray'}-700 capitalize">${t.priority}</span>` : '';
    const proj = t.project_id && projectNames[t.project_id] ? `<span class="text-[11px] text-gray-400">${projectNames[t.project_id]}</span>` : '';
    return `<div draggable="true" data-id="${t.id}" class="task-card bg-white rounded-xl border border-gray-200 p-3 shadow-sm cursor-grab active:cursor-grabbing hover:shadow-md transition-shadow">
      <p class="text-sm font-medium text-gray-900">${t.title}</p>
      <div class="flex items-center justify-between mt-2">${proj}${prio}</div>
    </div>`;
  }

  async function loadBoard() {
    const pid = document.getElementById('board-project').value;
    const qs = pid ? `?project_id=${pid}&per_page=200` : '?per_page=200';
    const data = await fetchData(`/tasks${qs}`);
    const tasks = (data && data.tasks) || [];
    const byStatus = {};
    COLUMNS.forEach(c => byStatus[c.key] = []);
    tasks.forEach(t => { (byStatus[t.status] || (byStatus[t.status] = [])).push(t); });

    document.getElementById('board').innerHTML = COLUMNS.map(c => `
      <div class="bg-gray-100/70 rounded-2xl p-3">
        <div class="flex items-center justify-between px-2 mb-3">
          <h3 class="text-sm font-semibold text-gray-700"><span class="inline-block w-2 h-2 rounded-full bg-${c.color}-500 mr-2"></span>${c.label}</h3>
          <span class="text-xs text-gray-400">${(byStatus[c.key] || []).length}</span>
        </div>
        <div class="col-body space-y-2 min-h-[120px]" data-status="${c.key}">
          ${(byStatus[c.key] || []).map(card).join('')}
        </div>
      </div>`).join('');
    wireDnd();
  }

  function wireDnd() {
    document.querySelectorAll('.task-card').forEach(el => {
      el.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', el.dataset.id); el.classList.add('opacity-50'); });
      el.addEventListener('dragend', () => el.classList.remove('opacity-50'));
    });
    document.querySelectorAll('.col-body').forEach(col => {
      col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('ring-2', 'ring-primary-300', 'rounded-lg'); });
      col.addEventListener('dragleave', () => col.classList.remove('ring-2', 'ring-primary-300', 'rounded-lg'));
      col.addEventListener('drop', async (e) => {
        e.preventDefault();
        col.classList.remove('ring-2', 'ring-primary-300', 'rounded-lg');
        const id = e.dataTransfer.getData('text/plain');
        const status = col.dataset.status;
        const r = await fetch(`/api/tasks/${id}`, { method: 'PUT', headers: getHeaders(), body: JSON.stringify({ status }) });
        if (r.ok) loadBoard(); else alert('Could not move task');
      });
    });
  }

  document.getElementById('quick-add').addEventListener('submit', async (e) => {
    e.preventDefault();
    const title = document.getElementById('qa-title').value.trim();
    if (!title) return;
    const pid = document.getElementById('board-project').value || null;
    const r = await fetch('/api/tasks', { method: 'POST', headers: getHeaders(), body: JSON.stringify({ title, status: 'todo', project_id: pid }) });
    if (r.ok) { document.getElementById('qa-title').value = ''; loadBoard(); } else { alert('Could not add task'); }
  });

  document.getElementById('board-project').addEventListener('change', loadBoard);
  loadProjects().then(loadBoard);
</script>
{% endblock %}
