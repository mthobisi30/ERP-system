{% extends "layout.html" %}

{% block content %}
<div class="max-w-6xl mx-auto space-y-6">

  <!-- Utilisation -->
  <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
    <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between gap-4">
      <h3 class="font-semibold text-gray-900"><i class="fas fa-gauge-high text-primary-500 mr-2"></i>Team Utilisation</h3>
      <div class="flex items-center gap-2 text-sm">
        <input type="date" id="u-from" class="px-2 py-1.5 border border-gray-200 rounded-lg bg-gray-50">
        <span class="text-gray-400">→</span>
        <input type="date" id="u-to" class="px-2 py-1.5 border border-gray-200 rounded-lg bg-gray-50">
        <button id="u-apply" class="px-3 py-1.5 bg-gray-100 rounded-lg hover:bg-gray-200">Apply</button>
      </div>
    </div>
    <div id="util-body"><div class="p-8 text-center text-gray-400 text-sm">Loading…</div></div>
  </div>

  <!-- Profitability -->
  <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
    <div class="px-6 py-4 border-b border-gray-100"><h3 class="font-semibold text-gray-900"><i class="fas fa-scale-balanced text-primary-500 mr-2"></i>Project Profitability</h3></div>
    <div id="profit-body"><div class="p-8 text-center text-gray-400 text-sm">Loading…</div></div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <!-- Pipeline -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
      <div class="px-6 py-4 border-b border-gray-100"><h3 class="font-semibold text-gray-900"><i class="fas fa-funnel-dollar text-primary-500 mr-2"></i>Sales Pipeline</h3></div>
      <div id="pipeline-body"><div class="p-8 text-center text-gray-400 text-sm">Loading…</div></div>
    </div>

    <!-- Revenue -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
      <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
        <h3 class="font-semibold text-gray-900"><i class="fas fa-chart-column text-primary-500 mr-2"></i>Revenue by Month</h3>
        <span id="rev-total" class="text-sm text-gray-500"></span>
      </div>
      <div id="revenue-body" class="p-6"><div class="text-center text-gray-400 text-sm">Loading…</div></div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const RMONEY = n => 'R ' + Number(n || 0).toLocaleString('en-ZA', {minimumFractionDigits: 0, maximumFractionDigits: 0});
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function bar(pct, color) {
    return `<div class="w-full bg-gray-100 rounded-full h-2"><div class="h-2 rounded-full bg-${color}-500" style="width:${Math.min(100, pct)}%"></div></div>`;
  }

  async function loadUtil() {
    const from = document.getElementById('u-from').value;
    const to = document.getElementById('u-to').value;
    const qs = from && to ? `?from=${from}&to=${to}` : '';
    const data = await fetchData(`/reports/utilisation${qs}`);
    const body = document.getElementById('util-body');
    if (!data) return;
    document.getElementById('u-from').value = data.from;
    document.getElementById('u-to').value = data.to;
    if (!data.people.length) { body.innerHTML = '<div class="p-8 text-center text-gray-400 text-sm">No time logged in this range.</div>'; return; }
    body.innerHTML = `
      <table class="min-w-full">
        <thead class="bg-gray-50 text-xs font-semibold text-gray-500 uppercase">
          <tr><th class="px-5 py-3 text-left">Person</th><th class="px-5 py-3 text-right">Billable</th>
          <th class="px-5 py-3 text-right">Total</th><th class="px-5 py-3 text-left w-48">Utilisation (capacity ${data.capacity_hours_per_person}h)</th></tr>
        </thead>
        <tbody>${data.people.map(p => `
          <tr class="border-b border-gray-100 last:border-0">
            <td class="px-5 py-3 text-sm font-medium text-gray-900">${p.name}</td>
            <td class="px-5 py-3 text-sm text-right">${p.billable_hours}h</td>
            <td class="px-5 py-3 text-sm text-right text-gray-500">${p.total_hours}h</td>
            <td class="px-5 py-3"><div class="flex items-center gap-2"><span class="text-xs w-10 text-gray-600">${p.utilisation_of_capacity}%</span>${bar(p.utilisation_of_capacity, 'primary')}</div></td>
          </tr>`).join('')}</tbody>
      </table>`;
  }

  async function loadProfit() {
    const data = await fetchData('/reports/project-profitability');
    const body = document.getElementById('profit-body');
    if (!data) return;
    if (!data.projects.length) { body.innerHTML = '<div class="p-8 text-center text-gray-400 text-sm">No billable time logged yet.</div>'; return; }
    body.innerHTML = `
      <table class="min-w-full">
        <thead class="bg-gray-50 text-xs font-semibold text-gray-500 uppercase">
          <tr><th class="px-5 py-3 text-left">Project</th><th class="px-5 py-3 text-right">Hours</th>
          <th class="px-5 py-3 text-right">Revenue</th><th class="px-5 py-3 text-right">Cost</th>
          <th class="px-5 py-3 text-right">Margin</th><th class="px-5 py-3 text-right">%</th></tr>
        </thead>
        <tbody>${data.projects.map(p => `
          <tr class="border-b border-gray-100 last:border-0">
            <td class="px-5 py-3 text-sm font-medium text-gray-900">${p.name}</td>
            <td class="px-5 py-3 text-sm text-right text-gray-500">${p.hours}h</td>
            <td class="px-5 py-3 text-sm text-right">${RMONEY(p.revenue)}</td>
            <td class="px-5 py-3 text-sm text-right text-gray-500">${RMONEY(p.cost)}</td>
            <td class="px-5 py-3 text-sm text-right font-medium ${p.margin >= 0 ? 'text-green-600' : 'text-red-600'}">${RMONEY(p.margin)}</td>
            <td class="px-5 py-3 text-sm text-right ${p.margin >= 0 ? 'text-green-600' : 'text-red-600'}">${p.margin_pct == null ? '—' : p.margin_pct + '%'}</td>
          </tr>`).join('')}</tbody>
        <tfoot class="bg-gray-50 font-semibold text-sm">
          <tr><td class="px-5 py-3">Total</td><td></td>
          <td class="px-5 py-3 text-right">${RMONEY(data.totals.revenue)}</td>
          <td class="px-5 py-3 text-right">${RMONEY(data.totals.cost)}</td>
          <td class="px-5 py-3 text-right ${data.totals.margin >= 0 ? 'text-green-600' : 'text-red-600'}">${RMONEY(data.totals.margin)}</td><td></td></tr>
        </tfoot>
      </table>`;
  }

  async function loadPipeline() {
    const data = await fetchData('/reports/pipeline');
    const body = document.getElementById('pipeline-body');
    if (!data) return;
    body.innerHTML = `
      <div class="p-6 space-y-3">
        <div class="flex justify-between text-sm"><span class="text-gray-500">Open opportunities</span><span class="font-semibold">${data.open_count}</span></div>
        <div class="flex justify-between text-sm"><span class="text-gray-500">Total value</span><span class="font-semibold">${RMONEY(data.total_value)}</span></div>
        <div class="flex justify-between text-sm"><span class="text-gray-500">Weighted value</span><span class="font-semibold text-primary-600">${RMONEY(data.weighted_value)}</span></div>
        <div class="pt-2 space-y-2">${data.stages.map(s => `
          <div><div class="flex justify-between text-xs text-gray-600 mb-1"><span class="capitalize">${s.stage.replace(/_/g,' ')} (${s.count})</span><span>${RMONEY(s.value)}</span></div>
          ${bar(data.total_value ? s.value / data.total_value * 100 : 0, 'primary')}</div>`).join('') || '<p class="text-sm text-gray-400">No open opportunities.</p>'}</div>
      </div>`;
  }

  async function loadRevenue() {
    const data = await fetchData('/reports/revenue');
    const body = document.getElementById('revenue-body');
    if (!data) return;
    document.getElementById('rev-total').textContent = `${data.year}: ${RMONEY(data.total)}`;
    const max = Math.max(1, ...data.months.map(m => m.total));
    body.innerHTML = `<div class="flex items-end gap-1 h-40">${data.months.map(m => `
      <div class="flex-1 flex flex-col items-center justify-end gap-1" title="${MONTHS[m.month-1]}: ${RMONEY(m.total)}">
        <div class="w-full bg-primary-500 rounded-t" style="height:${m.total / max * 100}%"></div>
        <span class="text-[10px] text-gray-400">${MONTHS[m.month-1]}</span>
      </div>`).join('')}</div>`;
  }

  document.getElementById('u-apply').addEventListener('click', loadUtil);
  loadUtil(); loadProfit(); loadPipeline(); loadRevenue();
</script>
{% endblock %}
