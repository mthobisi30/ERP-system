{% extends "layout.html" %}

{% block content %}
<div class="max-w-6xl mx-auto space-y-6">

  <!-- Selector -->
  <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
    <h2 class="text-lg font-semibold text-gray-900 mb-4"><i class="fas fa-file-invoice-dollar text-primary-500 mr-2"></i>Generate Invoice from Time</h2>
    <div class="flex flex-col sm:flex-row gap-3 sm:items-end">
      <div class="flex-1">
        <label class="block text-xs font-medium text-gray-500 mb-1">Project</label>
        <select id="bill-project" class="w-full px-3 py-2 border border-gray-200 rounded-lg bg-gray-50 text-sm focus:ring-2 focus:ring-primary-500"></select>
      </div>
      <button id="load-unbilled" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 text-sm font-medium">Preview unbilled</button>
    </div>
  </div>

  <!-- Preview -->
  <div id="preview" class="hidden bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
    <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
      <h3 class="font-semibold text-gray-900">Unbilled Billable Time</h3>
      <button id="generate-btn" class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 text-sm font-semibold disabled:opacity-50">
        <i class="fas fa-bolt mr-1"></i> Generate Invoice
      </button>
    </div>
    <div id="preview-body"></div>
  </div>

  <!-- Result -->
  <div id="result" class="hidden bg-green-50 border border-green-200 rounded-2xl p-6"></div>

  <!-- Recent invoices -->
  <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
    <div class="px-6 py-4 border-b border-gray-100"><h3 class="font-semibold text-gray-900">Recent Invoices</h3></div>
    <div id="invoices-body"><div class="p-8 text-center text-gray-400 text-sm">Loading…</div></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const RMONEY = n => 'R ' + Number(n || 0).toLocaleString('en-ZA', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  const VAT = 15;
  const STATUS_COLORS = { paid: 'green', partial: 'yellow', draft: 'gray', sent: 'blue', overdue: 'red', cancelled: 'red' };

  async function loadProjects() {
    const data = await fetchData('/projects');
    const sel = document.getElementById('bill-project');
    const projects = (data && data.projects) || [];
    sel.innerHTML = projects.length
      ? projects.map(p => `<option value="${p.id}">${p.name}</option>`).join('')
      : '<option value="">No projects yet</option>';
  }

  async function loadUnbilled() {
    const pid = document.getElementById('bill-project').value;
    if (!pid) return;
    const data = await fetchData(`/projects/${pid}/unbilled-time`);
    const preview = document.getElementById('preview');
    const body = document.getElementById('preview-body');
    const btn = document.getElementById('generate-btn');
    preview.classList.remove('hidden');
    document.getElementById('result').classList.add('hidden');

    if (!data || !data.entry_count) {
      body.innerHTML = '<div class="p-8 text-center text-gray-400 text-sm">Nothing to bill — no unbilled billable time on this project.</div>';
      btn.disabled = true;
      return;
    }
    btn.disabled = false;
    const subtotal = data.total_amount;
    const vat = subtotal * VAT / 100;
    const rows = data.entries.map(e => `
      <tr class="border-b border-gray-100 last:border-0">
        <td class="px-5 py-3 text-sm text-gray-600">${e.entry_date}</td>
        <td class="px-5 py-3 text-sm text-gray-900">${e.description || '—'}</td>
        <td class="px-5 py-3 text-sm text-right">${e.hours}h</td>
        <td class="px-5 py-3 text-sm text-right">${RMONEY(e.bill_rate)}</td>
        <td class="px-5 py-3 text-sm text-right font-medium">${RMONEY(e.amount)}</td>
      </tr>`).join('');
    body.innerHTML = `
      <table class="min-w-full">
        <thead class="bg-gray-50 text-xs font-semibold text-gray-500 uppercase">
          <tr><th class="px-5 py-3 text-left">Date</th><th class="px-5 py-3 text-left">Description</th>
          <th class="px-5 py-3 text-right">Hours</th><th class="px-5 py-3 text-right">Rate</th><th class="px-5 py-3 text-right">Amount</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="px-6 py-4 bg-gray-50 border-t border-gray-100 flex justify-end">
        <div class="w-64 space-y-1 text-sm">
          <div class="flex justify-between text-gray-600"><span>Subtotal (${data.total_hours}h)</span><span>${RMONEY(subtotal)}</span></div>
          <div class="flex justify-between text-gray-600"><span>VAT (${VAT}%)</span><span>${RMONEY(vat)}</span></div>
          <div class="flex justify-between font-bold text-gray-900 pt-1 border-t border-gray-200"><span>Total</span><span>${RMONEY(subtotal + vat)}</span></div>
        </div>
      </div>`;
  }

  document.getElementById('generate-btn').addEventListener('click', async () => {
    const pid = document.getElementById('bill-project').value;
    const btn = document.getElementById('generate-btn');
    btn.disabled = true; btn.innerHTML = 'Generating…';
    const r = await fetch('/api/invoices/generate-from-time', { method: 'POST', headers: getHeaders(), body: JSON.stringify({ project_id: pid }) });
    const data = await r.json();
    btn.innerHTML = '<i class="fas fa-bolt mr-1"></i> Generate Invoice';
    const result = document.getElementById('result');
    result.classList.remove('hidden');
    if (r.ok) {
      const inv = data.invoice;
      result.className = 'bg-green-50 border border-green-200 rounded-2xl p-6';
      result.innerHTML = `<div class="flex items-center gap-3"><i class="fas fa-check-circle text-green-600 text-2xl"></i>
        <div><p class="font-semibold text-green-900">Invoice ${inv.invoice_number} created — ${RMONEY(inv.total_amount)} (incl. ${RMONEY(inv.vat_amount)} VAT)</p>
        <p class="text-sm text-green-700">${data.items.length} line item(s). Status: ${inv.status}.</p></div></div>`;
      document.getElementById('preview').classList.add('hidden');
      loadInvoices();
    } else {
      result.className = 'bg-red-50 border border-red-200 rounded-2xl p-6 text-red-700 text-sm';
      result.textContent = data.error || 'Could not generate invoice.';
    }
  });

  window.sendInvoice = async function (id) {
    try {
      const r = await apiFetch(`/invoices/${id}/send`, { method: 'POST', body: JSON.stringify({}) });
      showToast(r.sent ? `Emailed to ${r.to}` : (r.message || 'Email not configured'), r.sent ? 'success' : 'info');
      if (r.sent) loadInvoices();
    } catch (e) {}
  };

  async function loadInvoices() {
    const data = await fetchData('/invoices');
    const body = document.getElementById('invoices-body');
    const invoices = (data && data.invoices) || [];
    if (!invoices.length) { body.innerHTML = '<div class="p-8 text-center text-gray-400 text-sm">No invoices yet.</div>'; return; }
    body.innerHTML = `
      <table class="min-w-full">
        <thead class="bg-gray-50 text-xs font-semibold text-gray-500 uppercase">
          <tr><th class="px-5 py-3 text-left">Invoice #</th><th class="px-5 py-3 text-left">Date</th>
          <th class="px-5 py-3 text-right">Total</th><th class="px-5 py-3 text-right">Balance</th><th class="px-5 py-3 text-center">Status</th><th class="px-5 py-3 text-right">PDF</th></tr>
        </thead>
        <tbody>${invoices.map(i => `
          <tr class="border-b border-gray-100 last:border-0 hover:bg-gray-50">
            <td class="px-5 py-3 text-sm font-medium text-gray-900">${i.invoice_number}</td>
            <td class="px-5 py-3 text-sm text-gray-600">${i.invoice_date || '—'}</td>
            <td class="px-5 py-3 text-sm text-right">${RMONEY(i.total_amount)}</td>
            <td class="px-5 py-3 text-sm text-right">${RMONEY(i.balance_due)}</td>
            <td class="px-5 py-3 text-center"><span class="px-2 py-0.5 rounded-full text-xs bg-${STATUS_COLORS[i.status] || 'gray'}-100 text-${STATUS_COLORS[i.status] || 'gray'}-800 capitalize">${i.status}</span></td>
            <td class="px-5 py-3 text-right whitespace-nowrap">
              <button onclick="openPdf('/api/invoices/${i.id}/pdf')" class="text-primary-600 hover:text-primary-800 mr-3" title="Download PDF"><i class="fas fa-file-pdf"></i></button>
              <button onclick="sendInvoice('${i.id}')" class="text-primary-600 hover:text-primary-800" title="Email to client"><i class="fas fa-paper-plane"></i></button>
            </td>
          </tr>`).join('')}</tbody>
      </table>`;
  }

  document.getElementById('load-unbilled').addEventListener('click', loadUnbilled);
  document.getElementById('bill-project').addEventListener('change', loadUnbilled);
  loadProjects();
  loadInvoices();
</script>
{% endblock %}
