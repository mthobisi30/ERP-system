{% extends "layout.html" %}

{% block content %}
<div class="max-w-6xl mx-auto space-y-6">

  <!-- Log time -->
  <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
    <h2 class="text-lg font-semibold text-gray-900 mb-4"><i class="fas fa-stopwatch text-primary-500 mr-2"></i>Log Time</h2>
    <form id="log-form" class="grid grid-cols-1 md:grid-cols-12 gap-3 items-end">
      <div class="md:col-span-3">
        <label class="block text-xs font-medium text-gray-500 mb-1">Project</label>
        <select name="project_id" id="ts-project" required class="w-full px-3 py-2 border border-gray-200 rounded-lg bg-gray-50 text-sm focus:ring-2 focus:ring-primary-500"></select>
      </div>
      <div class="md:col-span-2">
        <label class="block text-xs font-medium text-gray-500 mb-1">Date</label>
        <input type="date" name="entry_date" id="ts-date" required class="w-full px-3 py-2 border border-gray-200 rounded-lg bg-gray-50 text-sm focus:ring-2 focus:ring-primary-500">
      </div>
      <div class="md:col-span-1">
        <label class="block text-xs font-medium text-gray-500 mb-1">Hours</label>
        <input type="number" step="0.25" min="0" name="hours" id="ts-hours" required class="w-full px-3 py-2 border border-gray-200 rounded-lg bg-gray-50 text-sm focus:ring-2 focus:ring-primary-500">
      </div>
      <div class="md:col-span-4">
        <label class="block text-xs font-medium text-gray-500 mb-1">Description</label>
        <input type="text" name="description" id="ts-desc" placeholder="What did you work on?" class="w-full px-3 py-2 border border-gray-200 rounded-lg bg-gray-50 text-sm focus:ring-2 focus:ring-primary-500">
      </div>
      <div class="md:col-span-1 flex items-center gap-2 pb-2">
        <input type="checkbox" id="ts-billable" checked class="w-4 h-4 text-primary-600 rounded">
        <label for="ts-billable" class="text-xs font-medium text-gray-600">Billable</label>
      </div>
      <div class="md:col-span-1">
        <button type="submit" class="w-full px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 text-sm font-semibold">Add</button>
      </div>
    </form>
    <p id="log-msg" class="text-sm mt-3 hidden"></p>
  </div>

  <!-- Week navigation -->
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-2">
      <button id="prev-week" class="px-3 py-2 border border-gray-200 rounded-lg text-sm text-gray-600 hover:bg-white"><i class="fas fa-chevron-left"></i></button>
      <button id="this-week" class="px-3 py-2 border border-gray-200 rounded-lg text-sm text-gray-600 hover:bg-white">This week</button>
      <button id="next-week" class="px-3 py-2 border border-gray-200 rounded-lg text-sm text-gray-600 hover:bg-white"><i class="fas fa-chevron-right"></i></button>
      <span id="week-label" class="ml-3 text-sm font-medium text-gray-700"></span>
    </div>
    <div class="text-sm text-gray-500">Total this week: <span id="week-total" class="font-bold text-gray-900">0h</span></div>
  </div>

  <!-- Entries -->
  <div id="ts-container" class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
    <div class="p-8 text-center text-gray-400 text-sm">Loading…</div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const RMONEY = n => 'R ' + Number(n || 0).toLocaleString('en-ZA', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  let weekAnchor = new Date();

  function isoDate(d) { return d.toISOString().slice(0, 10); }

  async function loadProjects() {
    const data = await fetchData('/projects');
    const sel = document.getElementById('ts-project');
    const projects = (data && data.projects) || [];
    sel.innerHTML = projects.length
      ? projects.map(p => `<option value="${p.id}">${p.name}</option>`).join('')
      : '<option value="">No projects — create one first</option>';
  }

  async function loadWeek() {
    const res = await fetchData(`/time-tracking/timesheet?week=${isoDate(weekAnchor)}`);
    if (!res) return;
    document.getElementById('week-label').textContent = `${res.week_start} → ${res.week_end}`;
    document.getElementById('week-total').textContent = `${res.total_hours}h`;

    const c = document.getElementById('ts-container');
    if (!res.entries.length) {
      c.innerHTML = '<div class="p-8 text-center text-gray-400 text-sm">No time logged this week.</div>';
      return;
    }
    const rows = res.entries.map(e => `
      <tr class="border-b border-gray-100 last:border-0 hover:bg-gray-50">
        <td class="px-5 py-3 text-sm text-gray-600">${e.entry_date}</td>
        <td class="px-5 py-3 text-sm text-gray-900">${e.description || '—'}</td>
        <td class="px-5 py-3 text-sm text-right text-gray-900">${e.hours}h</td>
        <td class="px-5 py-3 text-sm text-center">${e.billable
            ? '<span class="px-2 py-0.5 rounded-full text-xs bg-green-100 text-green-800">Billable</span>'
            : '<span class="px-2 py-0.5 rounded-full text-xs bg-gray-100 text-gray-600">Internal</span>'}</td>
        <td class="px-5 py-3 text-sm text-right text-gray-600">${e.billable ? RMONEY(e.amount) : '—'}</td>
        <td class="px-5 py-3 text-right">${e.invoiced
            ? '<span class="text-xs text-gray-400">invoiced</span>'
            : `<button onclick="deleteEntry('${e.id}')" class="text-red-400 hover:text-red-600"><i class="fas fa-trash"></i></button>`}</td>
      </tr>`).join('');
    c.innerHTML = `
      <table class="min-w-full">
        <thead class="bg-gray-50 text-xs font-semibold text-gray-500 uppercase">
          <tr>
            <th class="px-5 py-3 text-left">Date</th><th class="px-5 py-3 text-left">Description</th>
            <th class="px-5 py-3 text-right">Hours</th><th class="px-5 py-3 text-center">Type</th>
            <th class="px-5 py-3 text-right">Value</th><th class="px-5 py-3"></th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  window.deleteEntry = async function (id) {
    if (!confirm('Delete this time entry?')) return;
    const r = await fetch(`/api/time-tracking/${id}`, { method: 'DELETE', headers: getHeaders() });
    if (r.ok) loadWeek(); else alert('Could not delete (already invoiced?)');
  };

  document.getElementById('log-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = {
      project_id: document.getElementById('ts-project').value,
      entry_date: document.getElementById('ts-date').value,
      hours: parseFloat(document.getElementById('ts-hours').value),
      description: document.getElementById('ts-desc').value,
      billable: document.getElementById('ts-billable').checked,
    };
    const msg = document.getElementById('log-msg');
    const r = await fetch('/api/time-tracking', { method: 'POST', headers: getHeaders(), body: JSON.stringify(body) });
    const data = await r.json();
    msg.classList.remove('hidden');
    if (r.ok) {
      msg.className = 'text-sm mt-3 text-green-600';
      msg.textContent = `Logged ${data.hours}h${data.billable ? ' @ ' + RMONEY(data.bill_rate) + '/h = ' + RMONEY(data.amount) : ''}.`;
      document.getElementById('ts-hours').value = '';
      document.getElementById('ts-desc').value = '';
      loadWeek();
    } else {
      msg.className = 'text-sm mt-3 text-red-600';
      msg.textContent = data.error || 'Could not log time.';
    }
  });

  document.getElementById('prev-week').addEventListener('click', () => { weekAnchor.setDate(weekAnchor.getDate() - 7); loadWeek(); });
  document.getElementById('next-week').addEventListener('click', () => { weekAnchor.setDate(weekAnchor.getDate() + 7); loadWeek(); });
  document.getElementById('this-week').addEventListener('click', () => { weekAnchor = new Date(); loadWeek(); });

  document.getElementById('ts-date').value = isoDate(new Date());
  loadProjects();
  loadWeek();
</script>
{% endblock %}
