{% extends "layout.html" %}

{% block content %}
<div class="max-w-6xl mx-auto space-y-6">
  <!-- Create -->
  <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
    <h2 class="text-lg font-semibold text-gray-900 mb-4"><i class="fas fa-user-plus text-primary-500 mr-2"></i>Add User</h2>
    <form id="user-form" class="grid grid-cols-1 md:grid-cols-12 gap-3 items-end">
      <div class="md:col-span-2"><label class="block text-xs font-medium text-gray-500 mb-1">First name</label><input id="u-first" class="w-full px-3 py-2 border border-gray-200 rounded-lg bg-gray-50 text-sm"></div>
      <div class="md:col-span-2"><label class="block text-xs font-medium text-gray-500 mb-1">Last name</label><input id="u-last" class="w-full px-3 py-2 border border-gray-200 rounded-lg bg-gray-50 text-sm"></div>
      <div class="md:col-span-2"><label class="block text-xs font-medium text-gray-500 mb-1">Email</label><input id="u-email" type="email" required class="w-full px-3 py-2 border border-gray-200 rounded-lg bg-gray-50 text-sm"></div>
      <div class="md:col-span-2"><label class="block text-xs font-medium text-gray-500 mb-1">Username</label><input id="u-username" required class="w-full px-3 py-2 border border-gray-200 rounded-lg bg-gray-50 text-sm"></div>
      <div class="md:col-span-1"><label class="block text-xs font-medium text-gray-500 mb-1">Role</label>
        <select id="u-role" class="w-full px-3 py-2 border border-gray-200 rounded-lg bg-gray-50 text-sm"><option value="employee">Employee</option><option value="manager">Manager</option><option value="admin">Admin</option></select></div>
      <div class="md:col-span-2"><label class="block text-xs font-medium text-gray-500 mb-1">Temp password</label><input id="u-pass" required class="w-full px-3 py-2 border border-gray-200 rounded-lg bg-gray-50 text-sm"></div>
      <div class="md:col-span-1"><button class="w-full px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 text-sm font-semibold">Add</button></div>
    </form>
    <p class="text-xs text-gray-400 mt-2">Creating users requires an admin account.</p>
  </div>

  <!-- List -->
  <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
    <div class="px-6 py-4 border-b border-gray-100"><h3 class="font-semibold text-gray-900">Users</h3></div>
    <div id="users"><div class="p-8 text-center text-gray-400 text-sm">Loading…</div></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const ROLE_C = { admin: 'red', manager: 'blue', employee: 'gray' };

  async function load() {
    const data = await fetchData('/users');
    const el = document.getElementById('users');
    const list = (data && data.users) || [];
    if (!list.length) { el.innerHTML = '<div class="p-8 text-center text-gray-400 text-sm">No users.</div>'; return; }
    el.innerHTML = `<table class="min-w-full"><thead class="bg-gray-50 text-xs font-semibold text-gray-500 uppercase">
      <tr><th class="px-5 py-3 text-left">Name</th><th class="px-5 py-3 text-left">Email</th><th class="px-5 py-3 text-left">Role</th><th class="px-5 py-3 text-center">Active</th><th class="px-5 py-3 text-right">Actions</th></tr></thead>
      <tbody>${list.map(u => `<tr class="border-b border-gray-100 last:border-0 hover:bg-gray-50">
        <td class="px-5 py-3 text-sm font-medium text-gray-900">${[u.first_name, u.last_name].filter(Boolean).join(' ') || u.username}</td>
        <td class="px-5 py-3 text-sm text-gray-600">${u.email}</td>
        <td class="px-5 py-3 text-sm">
          <select onchange="setRole('${u.id}', this.value)" class="text-xs border border-gray-200 rounded px-2 py-1 bg-white">
            ${['employee', 'manager', 'admin'].map(r => `<option value="${r}" ${u.role === r ? 'selected' : ''}>${r}</option>`).join('')}
          </select>
        </td>
        <td class="px-5 py-3 text-center">${u.is_active ? '<span class="text-green-600"><i class="fas fa-circle-check"></i></span>' : '<span class="text-gray-300"><i class="fas fa-circle-xmark"></i></span>'}</td>
        <td class="px-5 py-3 text-right text-sm space-x-3">
          <button onclick="setActive('${u.id}', ${!u.is_active})" class="text-${u.is_active ? 'gray' : 'green'}-600 hover:underline">${u.is_active ? 'Deactivate' : 'Activate'}</button>
          <button onclick="delUser('${u.id}')" class="text-red-500 hover:underline">Delete</button>
        </td></tr>`).join('')}</tbody></table>`;
  }

  window.setRole = async function (id, role) {
    try { await apiFetch(`/users/${id}`, { method: 'PUT', body: JSON.stringify({ role }) }); showToast('Role updated', 'success'); } catch (e) { load(); }
  };
  window.setActive = async function (id, active) {
    try { await apiFetch(`/users/${id}`, { method: 'PUT', body: JSON.stringify({ is_active: active }) }); showToast(active ? 'User activated' : 'User deactivated', 'success'); load(); } catch (e) {}
  };
  window.delUser = async function (id) {
    if (!(await window.confirmDialog('Delete this user?'))) return;
    try { await apiFetch(`/users/${id}`, { method: 'DELETE' }); showToast('User deleted', 'success'); load(); } catch (e) {}
  };

  document.getElementById('user-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = {
      first_name: document.getElementById('u-first').value,
      last_name: document.getElementById('u-last').value,
      email: document.getElementById('u-email').value,
      username: document.getElementById('u-username').value,
      role: document.getElementById('u-role').value,
      password: document.getElementById('u-pass').value,
    };
    try {
      await apiFetch('/users', { method: 'POST', body: JSON.stringify(body) });
      showToast('User created', 'success');
      document.getElementById('user-form').reset();
      load();
    } catch (e) {}
  });

  load();
</script>
{% endblock %}
