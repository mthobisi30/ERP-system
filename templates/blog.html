{% extends "layout.html" %}

{% block content %}
<div class="max-w-6xl mx-auto space-y-6">
  <!-- Editor -->
  <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-semibold text-gray-900"><i class="fas fa-feather-pointed text-primary-500 mr-2"></i><span id="editor-title">New Post</span></h2>
      <button id="new-post" class="text-sm text-gray-500 hover:text-primary-600 hidden"><i class="fas fa-plus mr-1"></i>New</button>
    </div>
    <input type="hidden" id="post-id">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
      <input id="p-title" placeholder="Post title" class="md:col-span-2 px-3 py-2 border border-gray-200 rounded-lg bg-gray-50 text-sm">
      <select id="p-status" class="px-3 py-2 border border-gray-200 rounded-lg bg-gray-50 text-sm">
        <option value="draft">Draft</option><option value="published">Published</option>
      </select>
      <input id="p-tags" placeholder="Tags (comma separated)" class="px-3 py-2 border border-gray-200 rounded-lg bg-gray-50 text-sm">
      <input id="p-cover" placeholder="Cover image URL" class="md:col-span-2 px-3 py-2 border border-gray-200 rounded-lg bg-gray-50 text-sm">
    </div>
    <input id="p-excerpt" placeholder="Short excerpt" class="w-full mt-3 px-3 py-2 border border-gray-200 rounded-lg bg-gray-50 text-sm">
    <textarea id="p-body" rows="8" placeholder="Write your post… (markdown/plain text)" class="w-full mt-3 px-3 py-2 border border-gray-200 rounded-lg bg-gray-50 text-sm"></textarea>
    <div class="flex justify-end mt-3">
      <button id="save-post" class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 text-sm font-semibold">Save Post</button>
    </div>
  </div>

  <!-- Posts list -->
  <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
    <div class="px-6 py-4 border-b border-gray-100"><h3 class="font-semibold text-gray-900">Posts</h3></div>
    <div id="posts"><div class="p-8 text-center text-gray-400 text-sm">Loading…</div></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const ST = { draft: 'gray', published: 'green' };
  const badge = s => `<span class="px-2 py-0.5 rounded-full text-xs bg-${ST[s] || 'gray'}-100 text-${ST[s] || 'gray'}-800 capitalize">${s}</span>`;

  function resetEditor() {
    document.getElementById('post-id').value = '';
    ['p-title', 'p-tags', 'p-cover', 'p-excerpt', 'p-body'].forEach(i => document.getElementById(i).value = '');
    document.getElementById('p-status').value = 'draft';
    document.getElementById('editor-title').textContent = 'New Post';
    document.getElementById('new-post').classList.add('hidden');
  }

  async function loadPosts() {
    const data = await fetchData('/blog');
    const el = document.getElementById('posts');
    const list = (data && data.posts) || [];
    if (!list.length) { el.innerHTML = '<div class="p-8 text-center text-gray-400 text-sm">No posts yet — write your first above.</div>'; return; }
    el.innerHTML = `<table class="min-w-full"><thead class="bg-gray-50 text-xs font-semibold text-gray-500 uppercase">
      <tr><th class="px-5 py-3 text-left">Title</th><th class="px-5 py-3 text-left">Tags</th><th class="px-5 py-3 text-center">Status</th><th class="px-5 py-3 text-right">Actions</th></tr></thead>
      <tbody>${list.map(p => `<tr class="border-b border-gray-100 last:border-0 hover:bg-gray-50">
        <td class="px-5 py-3 text-sm font-medium text-gray-900">${p.title}</td>
        <td class="px-5 py-3 text-xs text-gray-500">${(p.tags || []).join(', ') || '—'}</td>
        <td class="px-5 py-3 text-center">${badge(p.status)}</td>
        <td class="px-5 py-3 text-right text-sm space-x-3">
          <button onclick="editPost('${p.id}')" class="text-primary-600 hover:underline">Edit</button>
          <button onclick="togglePublish('${p.id}', ${p.status !== 'published'})" class="text-${p.status === 'published' ? 'gray' : 'green'}-600 hover:underline">${p.status === 'published' ? 'Unpublish' : 'Publish'}</button>
          <button onclick="delPost('${p.id}')" class="text-red-500 hover:underline">Delete</button>
        </td></tr>`).join('')}</tbody></table>`;
  }

  window.editPost = async function (id) {
    const p = await fetchData(`/blog/${id}`);
    if (!p) return;
    document.getElementById('post-id').value = p.id;
    document.getElementById('p-title').value = p.title || '';
    document.getElementById('p-status').value = p.status || 'draft';
    document.getElementById('p-tags').value = (p.tags || []).join(', ');
    document.getElementById('p-cover').value = p.cover_image_url || '';
    document.getElementById('p-excerpt').value = p.excerpt || '';
    document.getElementById('p-body').value = p.body || '';
    document.getElementById('editor-title').textContent = 'Edit Post';
    document.getElementById('new-post').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  window.togglePublish = async function (id, publish) {
    try { await apiFetch(`/blog/${id}/publish`, { method: 'POST', body: JSON.stringify({ publish }) }); showToast(publish ? 'Post published' : 'Post unpublished', 'success'); loadPosts(); } catch (e) {}
  };

  window.delPost = async function (id) {
    if (!(await window.confirmDialog('Delete this post?'))) return;
    try { await apiFetch(`/blog/${id}`, { method: 'DELETE' }); showToast('Post deleted', 'success'); loadPosts(); } catch (e) {}
  };

  document.getElementById('new-post').addEventListener('click', resetEditor);

  document.getElementById('save-post').addEventListener('click', async () => {
    const id = document.getElementById('post-id').value;
    const body = {
      title: document.getElementById('p-title').value,
      status: document.getElementById('p-status').value,
      tags: document.getElementById('p-tags').value,
      cover_image_url: document.getElementById('p-cover').value,
      excerpt: document.getElementById('p-excerpt').value,
      body: document.getElementById('p-body').value,
    };
    if (!body.title) { showToast('Title is required', 'error'); return; }
    try {
      await apiFetch(id ? `/blog/${id}` : '/blog', { method: id ? 'PUT' : 'POST', body: JSON.stringify(body) });
      showToast('Post saved', 'success');
      resetEditor(); loadPosts();
    } catch (e) {}
  });

  loadPosts();
</script>
{% endblock %}
