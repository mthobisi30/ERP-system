name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create test databases
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c 'CREATE DATABASE erptest;'
          psql -h localhost -U postgres -c 'CREATE DATABASE migcheck;'

      - name: Migration applies cleanly
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migcheck
        run: alembic upgrade head

      - name: Run test suite
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erptest
        run: pytest -q
